name: Tests

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # daily 08:00 IST (02:30 UTC)

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13" # matches the Lambda runtime
  # FastAPI app deps for the API specs. Kept in step with requirements.txt until
  # the FastAPI/pydantic v2 migration; not part of the Lambda bundle.
  API_TEST_DEPS: "fastapi==0.95.0 email-validator==2.3.0"

jobs:
  unit-and-e2e:
    name: Unit + end-to-end (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-lambda.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lambda.txt -r requirements-dev.txt $API_TEST_DEPS

      # Fake court sites + captured SMTP + blocked sockets: nothing real is called or sent.
      - name: Run tests
        run: pytest tests -q -p no:cacheprovider --cov=app --cov=lambda_handler --cov-report=term-missing --cov-fail-under=90

  live-court-sites:
    name: Live court-site checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-lambda.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lambda.txt -r requirements-dev.txt $API_TEST_DEPS

      # Read-only requests to the court websites; no email is sent. A failure here
      # usually means the court changed its site (endpoints, response shape, blocking).
      - name: Run live checks
        env:
          RUN_LIVE: "1"
        run: pytest tests -m live -q -p no:cacheprovider -rs
